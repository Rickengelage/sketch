<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>sketch</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- the header of the page -->
    <header class="header-container">
        <div class="header-title-container">
            <h1 class="header-title">Etch-a-Sketch</h1>
        </div>
    </header>

    <!-- the main content on the page, the menu bar and grid -->
    <main class="main-container">
        <!-- the menu bar above the grid -->
        <div class="menu-container">
            <input type="range" name="grid-choice" class="grid-size" min="16" max="100">
            <button class="resize-btn">resize</button>
            <button class="clear-btn"> clear</button>
            <button class="eraser-btn">eraser</button>
            <input type="color"  id="color" value="#57B9FF" class="color-picker">
        <!-- the actual menu items go in here -->
            <div class="menu-items">  </div>
        </div>

        <!-- the outside main container of the grid -->
        <div class="grid-container">
          
        </div>
    </main>

    <script src = "script.js"> </script>
</body>
</html>
